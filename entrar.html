<!DOCTYPE html>
<html lang="pt-br"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Escolar / Início</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/inicio.css">
</head> 
<body>
    <div id="area-cabecalho"></div>

    <main class="conteudo-principal pagina-entrar">
        <section class="cartao caixa-entrar">
            <h1>Conta do Aluno</h1>
            <p>Acesso Demonstrativo ao portal da escola.</p>

            <form class="formulario-entrar" id="formulario-entrar">
                <label class="rotulo-campo">
                    E-mail
                    <input class="campo" id="email" type="email" placeholder="aluno@escola.com">
                </label>
            </form>
                <label class="rotulo-campo">
                    senha
                    <input class="campo" id="senha" type="password" placeholder="Digite sua senha">
                </label>

                <div class="ajuda-login">Projeto front-end: não utiliza banco de dados nem autenticação real.</div>
          
        </section>
    </main>

    <div id="area-rodape"></div>

    <script src="js/componentes.js"></script>
    <script src="js/entrar.js"></script>
</body>   
</html>
